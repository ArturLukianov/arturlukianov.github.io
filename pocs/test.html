function log(type, msg, data) {

  const cssClass = `log-${type}`;
  let html = `<div class="log-entry ${cssClass}">[${new Date().toLocaleTimeString()}] ${msg}`;
  if (data) {
    const dataStr = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    html += `\n${dataStr}`;
  }
  html += '</div>';
  el.innerHTML += html;
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
  eventCount = 0;
  updateStatus();

(function init() {
  log('info', '🔌 Waiting for MAX WebApp bridge...');

  // Strategy 1: window.WebApp already injected
  if (window.WebApp) {
