<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAX Bridge Diagnostic</title>
<style>
  body { font-family: monospace; background: #0a0a1a; color: #0f0; padding: 16px; font-size: 12px; }
  h1 { color: #0ff; font-size: 16px; }
  h2 { color: #f0f; font-size: 14px; margin-top: 16px; }
  .section { background: #111; border: 1px solid #333; padding: 12px; margin: 8px 0; border-radius: 4px; }
  .log { background: #000; border: 1px solid #333; padding: 8px; max-height: 400px;
         overflow-y: auto; white-space: pre-wrap; word-break: break-all; font-size: 11px; }
  .btn { background: #222; color: #0f0; border: 1px solid #0f0; padding: 8px 12px; margin: 4px;
         cursor: pointer; font-family: monospace; font-size: 11px; border-radius: 3px; }
  .btn:hover { background: #0f0; color: #000; }
  .found { color: #f00; }
  .ok { color: #0f0; }
  .warn { color: #ff0; }
  .info { color: #0ff; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  td, th { padding: 3px 6px; border: 1px solid #333; text-align: left; }
  th { background: #222; }
</style>
</head>
<body>
<h1>🔬 MAX Bridge Diagnostic</h1>

<div class="section">
  <h2>1. Environment</h2>
  <div id="env"></div>
</div>

<div class="section">
  <h2>2. QWebChannel Status</h2>
  <div id="qwc"></div>
</div>

<div class="section">
  <h2>3. Client Object (C++→JS bridge)</h2>
  <div id="client-info"></div>
</div>

<div class="section">
  <h2>4. window.WebApp</h2>
  <div id="webapp-info"></div>
</div>

<div class="section">
  <h2>5. Manual Test</h2>
  <button class="btn" onclick="testPostEvent()">Test postEvent</button>
  <button class="btn" onclick="testAllEventTypes()">Send All Event Types</button>
  <button class="btn" onclick="dumpAllGlobals()">Dump All window.*</button>
  <div id="test-results" class="log" style="margin-top:8px;"></div>
</div>

<div class="section">
  <h2>6. sendEvent Intercept Log</h2>
  <div id="events" class="log">Waiting...</div>
</div>

<script>
let qwClient = null;
let eventLog = [];

function log(el, msg, cls='') {
  document.getElementById(el).innerHTML += `<div class="${cls}">${msg}</div>`;
}

// Hook sendEvent early
(function() {
  const interval = setInterval(() => {
    if (window.WebApp && window.WebApp.sendEvent) {
      clearInterval(interval);
      const orig = window.WebApp.sendEvent.bind(window.WebApp);
      window.WebApp.sendEvent = function(type, data) {
        eventLog.push({ ts: Date.now(), type, data });
        const short = (data || '').substring(0, 200);
        log('events', `📨 sendEvent("${type}", ${short})`, 'ok');
        return orig(type, data);
      };
      log('events', '🪝 Hooked window.WebApp.sendEvent', 'ok');
    }
  }, 100);
})();

function testPostEvent() {
  if (!qwClient) { log('test-results', '❌ No client', 'found'); return; }

  const eventType = 'biometry_get_info';
  const payload = JSON.stringify({ requestId: 'diag-' + Date.now() });

  log('test-results', `Trying: client.postEvent("${eventType}", ${payload})`, 'info');

  try {
    if (typeof qwClient.postEvent === 'function') {
      qwClient.postEvent(eventType, payload);
      log('test-results', '✅ postEvent called', 'ok');
    } else if (typeof qwClient.sendEvent === 'function') {
      qwClient.sendEvent(eventType, payload);
      log('test-results', '✅ sendEvent called (note: may be the wrong direction)', 'warn');
    } else {
      log('test-results', `❌ No postEvent/sendEvent. Methods: ${Object.keys(qwClient).filter(k => typeof qwClient[k] === 'function').join(', ')}`, 'found');
    }
  } catch(e) {
    log('test-results', `❌ Error: ${e.message}`, 'found');
  }
}

function testAllEventTypes() {
  if (!qwClient) { log('test-results', '❌ No client', 'found'); return; }

  const events = [
    'biometry_get_info',
    'biometry_request_auth',
    'biometry_request_access',
    'biometry_update_token',
    'biometry_open_settings',
    'request_phone',
    'web_app_open_link',
    'web_app_open_max_link',
    'web_app_share',
    'web_app_max_share',
    'web_app_download_file',
    'secure_storage_save_key',
    'secure_storage_get_key',
    'secure_storage_clear',
    'device_storage_save_key',
    'device_storage_get_key',
    'device_storage_clear',
  ];

  log('test-results', `Sending ${events.length} event types...`, 'info');
  for (const evt of events) {
    const payload = JSON.stringify({ requestId: 'diag-' + Date.now() + '-' + evt });
    try {
      if (typeof qwClient.postEvent === 'function') {
        qwClient.postEvent(evt, payload);
        log('test-results', `  Sent: ${evt}`, 'ok');
      }
    } catch(e) {
      log('test-results', `  FAIL: ${evt} — ${e.message}`, 'found');
    }
  }
}

function dumpAllGlobals() {
  const interesting = [];
  for (const key of Object.keys(window)) {
    if (key.startsWith('qt') || key.startsWith('qw') || key.startsWith('Web') ||
        key.startsWith('web') || key.startsWith('QWeb') || key === 'WebApp' ||
        key.startsWith('max') || key.startsWith('MAX')) {
      interesting.push(key);
    }
  }
  log('test-results', `Interesting globals: ${interesting.join(', ') || 'NONE'}`, 'info');

  for (const key of interesting) {
    try {
      const val = window[key];
      if (val && typeof val === 'object') {
        const keys = Object.keys(val);
        log('test-results', `  window.${key}: ${typeof val} — keys: ${keys.slice(0,20).join(', ')}`, 'ok');
      } else {
        log('test-results', `  window.${key}: ${typeof val} = ${String(val).substring(0, 100)}`, 'ok');
      }
    } catch(e) {
      log('test-results', `  window.${key}: ERROR ${e.message}`, 'found');
    }
  }
}

// Init
setTimeout(function init() {
  // Environment
  log('env', `UserAgent: ${navigator.userAgent.substring(0, 100)}`, 'info');
  log('env', `Platform: ${navigator.platform}`, 'info');
  log('env', `QWebChannel: ${typeof QWebChannel}`, typeof QWebChannel !== 'undefined' ? 'ok' : 'warn');
  log('env', `qt: ${typeof qt}`, typeof qt !== 'undefined' ? 'ok' : 'warn');
  log('env', `qt.webChannelTransport: ${typeof (window.qt && qt.webChannelTransport)}`,
    (window.qt && qt.webChannelTransport) ? 'ok' : 'warn');

  // QWebChannel
  if (window.qt && window.qt.webChannelTransport) {
    log('qwc', '✅ qt.webChannelTransport found', 'ok');

    if (typeof QWebChannel !== 'undefined') {
      new QWebChannel(qt.webChannelTransport, function(channel) {
        log('qwc', `✅ QWebChannel connected. Objects: ${Object.keys(channel.objects).join(', ')}`, 'ok');

        // Client object
        const client = channel.objects.client;
        if (client) {
          qwClient = client;
          const type = typeof client;
          log('client-info', `client type: ${type}`, 'ok');

          const allKeys = Object.keys(client);
          const methods = allKeys.filter(k => typeof client[k] === 'function');
          const props = allKeys.filter(k => typeof client[k] !== 'function');

          log('client-info', `Properties: ${props.join(', ') || 'NONE'}`, 'info');
          log('client-info', `Methods: ${methods.join(', ') || 'NONE'}`, methods.length > 0 ? 'ok' : 'warn');

          // Show each method signature
          for (const m of methods) {
            log('client-info', `  client.${m}(${client[m].length} params)`, 'info');
          }

          // Show each property value (truncated)
          for (const p of props) {
            const val = client[p];
            log('client-info', `  client.${p} = ${typeof val === 'string' ? '"' + val.substring(0, 100) + '"' : String(val).substring(0, 100)}`, 'info');
          }

          // Look for sendEvent, postEvent, or alternative methods
          if (typeof client.postEvent === 'function') {
            log('client-info', '✅ client.postEvent() EXISTS — correct bridge protocol', 'ok');
          }
          if (typeof client.sendEvent === 'function') {
            log('client-info', '⚠️ client.sendEvent() exists (this is usually C++→JS)', 'warn');
          }
          if (typeof client.on === 'function') {
            log('client-info', 'client.on() exists — event listener pattern?', 'info');
          }
        } else {
          log('qwc', `❌ No "client". Objects: ${JSON.stringify(Object.keys(channel.objects))}`, 'found');
        }

        // window.WebApp
        if (window.WebApp) {
          const waKeys = Object.keys(window.WebApp);
          const waMethods = waKeys.filter(k => typeof window.WebApp[k] === 'function');
          const waProps = waKeys.filter(k => typeof window.WebApp[k] !== 'function');
          log('webapp-info', `window.WebApp methods (${waMethods.length}): ${waMethods.join(', ') || 'NONE'}`, 'ok');
          log('webapp-info', `window.WebApp props (${waProps.length}): ${waProps.join(', ') || 'NONE'}`, 'info');
        } else {
          log('webapp-info', 'window.WebApp does not exist yet (will be injected by C++ when needed)', 'warn');
        }
      });
    } else {
      log('qwc', '❌ QWebChannel library not available', 'found');
    }
  } else {
    log('qwc', '❌ No qt.webChannelTransport — not running in MAX?', 'found');
  }
}, 200);
</script>
</body>
</html>
